services:
  - type: web
    name: sih-skill-platform-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: ENABLE_SEMANTIC_SEARCH
        value: "false"

  - type: web
    name: sih-mock-igot-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn mock_igot.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LMS_WEBHOOK_URL
        sync: false
      - key: DATA_DIR
        value: /opt/render/project/src/data
